[package]
name = "alpamayo"
version = "0.18.2"
authors = ["Lamports Dev"]
edition = "2024"
description = "Part of Solana RPC stack for sealed data"
homepage = "https://lamports.dev"
repository = "https://github.com/lamports-dev/alpamayo"
license = "Apache-2.0"
keywords = ["solana", "rpc"]
publish = false

[dependencies]
affinity-linux = "1.0.1"
anyhow = "1.0.102"
base64 = "0.22.1"
bincode = "1.3.3"
bitflags = "2.13.0"
bitvec = "1.1.1"
bs58 = "0.5.1"
clap = { version = "4.6.6", features = ["derive"] }
crossbeam = "0.8.5"
foldhash = "0.2.0"
futures = "0.3.32"
http-body-util = "0.1.5"
human-size = "0.4.4"
humantime-serde = "1.1.1"
hyper = "1.11.1"
hyper-util = { version = "0.1.20", features = ["server-auto", "server-graceful"] }
json5 = "1.3.1"
jsonrpsee-types = "0.26.0"
libc = "0.2.170"
maplit = "1.0.2"
metrics = "0.24.1"
metrics-exporter-prometheus = { version = "0.18.0", default-features = false }
num_cpus = "1.17.0"
prost = "0.14.4"
quanta = "0.12.5"
rand = "0.9.4"
rayon = "1.12.0"
regex = "1.12.4"
reqwest = "0.12.28"
richat-client = { git = "https://github.com/Shyft-to/richat", branch = "feat/agave-4.2-upgrade" }
richat-metrics = { git = "https://github.com/Shyft-to/richat", branch = "feat/agave-4.2-upgrade" }
richat-proto = { git = "https://github.com/Shyft-to/richat", branch = "feat/agave-4.2-upgrade" }
richat-shared = { git = "https://github.com/Shyft-to/richat", branch = "feat/agave-4.2-upgrade", default-features = false, features = ["config", "jsonrpc", "version"] }
rocksdb = "0.24.0"
rustls = "0.23.41"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml = "0.9.34"
signal-hook = "0.4.4"
solana-borsh = "3.0.2"
solana-clock = ">=3.0.1,<3.2.0"
solana-commitment-config = "3.1.1"
solana-compute-budget = { version = "=4.2.2", features = ["agave-unstable-api"] }
solana-compute-budget-interface = { version = "3.0.0", features = ["borsh"] }
solana-epoch-rewards-hasher = "3.1.0"
solana-epoch-schedule = ">=3.2.0,<3.3.0"
solana-hash = ">=4.4.0,<4.6.0"
solana-instruction-error = ">=2.4.0,<2.5.0"
solana-message = ">=4.2.3,<4.5.0"
solana-pubkey = "4.2.0"
solana-rpc-client = "4.2.2"
solana-rpc-client-api = "4.2.2"
solana-signature = ">=3.4.1,<3.5.0"
solana-storage-proto = { version = "4.2.2", features = ["agave-unstable-api"] }
solana-transaction = ">=4.1.4,<4.2.0"
solana-transaction-context = "4.2.2"
solana-transaction-status = "4.2.2"
solana-version = "4.2.2"
solana-vote-interface = ">=6.0.2,<6.1.0"
thiserror = "2.0.18"
tikv-jemallocator = { version = "0.6.0", features = ["unprefixed_malloc_on_supported_platforms"] }
tokio = "1.52.3"
tokio-uring = "0.5.0"
tokio-util = "0.7.18"
tonic = "0.14.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["ansi", "env-filter", "json"] }
url = "2.5.8"

[build-dependencies]
anyhow = "1.0.102"
cargo-lock = "11.1.0"
git-version = "0.3.9"
vergen = { version = "9.0.4", features = ["build", "rustc"] }

[lints.clippy]
clone_on_ref_ptr = "deny"
missing_const_for_fn = "deny"
trivially_copy_pass_by_ref = "deny"

[profile.release]
lto = true
codegen-units = 1
